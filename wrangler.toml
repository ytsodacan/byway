name = "waze-private-server"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Create these with `wrangler kv namespace create CONFIG` / `TEMPLATES`,
# then paste the ids it prints in place of REPLACE_ME below.
kv_namespaces = [
  { binding = "CONFIG", id = "REPLACE_ME" },
  { binding = "TEMPLATES", id = "REPLACE_ME" },
]
